services:
  db:
    image: postgres:18.7-alpine
    container_name: kairo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo
      POSTGRES_DB: kairo
    ports:
      # Host port comes from DB_PORT in .env, so it can move when 5432 is taken by another project.
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps data under /var/lib/postgresql/<major>/, so the volume mounts the parent.
      - kairo-db-data:/var/lib/postgresql
      # Init scripts run once, on an empty volume: they create the kairo_test database for end-to-end tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kairo-db-data:
